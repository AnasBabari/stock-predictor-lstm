server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response (static and proxied).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        # Resolve the Compose service at request time. This lets nginx start
        # cleanly while the backend is becoming healthy and avoids baking an
        # internal service name into browser-side JavaScript.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite caller-supplied forwarding data at the trusted proxy boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 610s;
    }

    location = /health {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_health http://backend:8000/health;
        proxy_pass $backend_health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
