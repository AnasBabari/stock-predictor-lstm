[project]
name = "stock-predictor-lstm"
version = "1.1.0"
requires-python = ">=3.11"
description = "LSTM-based stock price forecasting API"
dependencies = [
    "boto3>=1.35.0,<2.0.0",
    "cachetools>=5.5.0,<6.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "numpy>=1.26.0,<2.4.0",
    "onnxruntime>=1.19.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=23.0.1,<24.0.0",
    "pandas-market-calendars>=4.4.0,<5.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "vadersentiment>=3.3.2,<4.0.0",
    "yfinance>=0.2.50,<1.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "filelock>=3.32.0",
]

[dependency-groups]
training = [
    "tensorflow>=2.16.0,<3.0.0",
]

dev = [
    "bandit>=1.7.5,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pip>=26.2,<27.0",
    "pip-audit>=2.7.0,<3.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<1.0.0",
    "psutil>=5.9.0,<8.0.0",
    # Research modules import this directly (research/ndx100/universe.py and
    # research/ndx100/csco_fixture.py). It previously arrived only
    # transitively, which is not a declaration of intent: a resolver change
    # could drop it and break the research job. Declared explicitly here
    # because the research tests run under the default (dev) group.
    "exchange-calendars>=4.13.0,<5.0.0",
    # Imported by research/ndx100/csco_fixture.py to pin BLAS thread counts
    # for reproducible neural training.
    "threadpoolctl>=3.5.0,<4.0.0",
    # scripts/check_ci_policy.py parses workflow YAML.
    "pyyaml>=6.0.0,<7.0.0",
]



[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # line length handled by formatter, B008 allowed for FastAPI Depends

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"

ignore_missing_imports = true
follow_imports = "skip"
warn_return_any = false
warn_unused_ignores = false
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = [".", "..", "../research"]

[tool.coverage.run]
omit = ["tests/*", "conftest.py"]
