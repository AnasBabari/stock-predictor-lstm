[project]
name = "stock-predictor-lstm"
version = "1.1.0"
requires-python = ">=3.11"
description = "LSTM-based stock price forecasting API"
dependencies = [
    "cachetools>=5.5.0,<6.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "numpy>=1.26.0,<2.4.0",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=18.0.0,<24.0.0",
    "pandas-market-calendars>=4.4.0,<5.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "tensorflow>=2.16.0,<3.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "vadersentiment>=3.3.2,<4.0.0",
    "yfinance>=0.2.50,<1.0.0",
    "cryptography>=45.0.0,<47.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.7.5,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"

ignore_missing_imports = true
follow_imports = "skip"
warn_return_any = false
warn_unused_ignores = false
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*", "conftest.py"]
