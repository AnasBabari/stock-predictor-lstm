services:
  - type: web
    name: stock-predictor-backend
    env: python
    region: oregon
    buildCommand: "pip install uv==0.11.16 && uv sync --project backend --frozen --no-dev"
    # Free-plan mode uses ephemeral saved_models; paid plans may set a mounted path.
    # Training is startup/operator work, never public request work.
    startCommand: "backend/.venv/bin/uvicorn api:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: MODEL_DIR
        value: saved_models
      - key: PREDICTION_WORKERS
        value: "1"
      - key: PREDICTION_QUEUE_SIZE
        value: "4"
      - key: PREDICTION_TIMEOUT_SECONDS
        value: "600"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TRAINING_CONCURRENCY
        value: "1"
      - key: MODEL_MAX_COUNT
        value: "20"
      - key: MODEL_MAX_STORAGE_MB
        value: "900"
      - key: MODEL_MIN_FREE_MB
        value: "100"
    disk:
      name: saved-models
      mountPath: /app/saved_models
      sizeGB: 1
