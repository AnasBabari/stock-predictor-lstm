services:
  - type: web
    name: stock-predictor-backend
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    # Use Render's native Python environment; the runtime dependency list is TensorFlow-free.
    startCommand: "python -m uvicorn api:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: PREDICTION_WORKERS
        value: "2"
      - key: PREDICTION_QUEUE_SIZE
        value: "4"
      - key: PREDICTION_TIMEOUT_SECONDS
        value: "600"
