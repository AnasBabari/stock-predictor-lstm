services:
  - type: web
    name: stock-predictor-backend
    env: python
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
    disk:
      name: saved-models
      mountPath: /app/backend/saved_models
      sizeGB: 1
