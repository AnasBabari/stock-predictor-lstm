name: Deployment Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      render_base_url:
        description: Optional Render service URL to smoke-test
        required: false
        type: string
      vercel_preview_url:
        description: Optional Vercel preview URL to run browser E2E against
        required: false
        type: string
      production:
        description: Run production smoke checks
        required: true
        default: false
        type: boolean
      certified_release:
        description: Require a verified certified release instead of strict abstention
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deployment-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resource-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.16
      - run: uv sync --project backend --frozen
      - run: uv run --project backend python scripts/check_resource_budget.py --json

  render-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: resource-budget
    if: ${{ inputs.render_base_url != '' || vars.RENDER_PREVIEW_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Smoke Render preview
        env:
          BASE_URL: ${{ inputs.render_base_url || vars.RENDER_PREVIEW_BASE_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/check_deployment.py --base-url "$BASE_URL" --expected-commit "$EXPECTED_COMMIT" --forecast-contract global_volatility_abstention --json --timeout 60 --restart-window 2

  vercel-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: resource-budget
    if: ${{ inputs.vercel_preview_url != '' || vars.VERCEL_PREVIEW_URL != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Run Vercel preview E2E
        env:
          VERCEL_PREVIEW_URL: ${{ inputs.vercel_preview_url || vars.VERCEL_PREVIEW_URL }}
        run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results

  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: resource-budget
    if: ${{ inputs.production && vars.RENDER_PRODUCTION_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Smoke production serving contract
        env:
          FORECAST_CONTRACT: ${{ inputs.certified_release && 'global_volatility' || 'global_volatility_abstention' }}
        run: python scripts/check_deployment.py --base-url "${{ vars.RENDER_PRODUCTION_BASE_URL }}" --expected-commit "${{ github.sha }}" --expected-environment production --forecast-contract "$FORECAST_CONTRACT" --json --timeout 60 --restart-window 5

  rollback-scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    if: ${{ failure() && vars.RENDER_ROLLBACK_SERVICE_ID != '' }}
    steps:
      - name: Safe rollback instructions
        run: |
          echo "Deployment gate failed. Automatic rollback is intentionally disabled."
          echo "Use the Render dashboard or an approved provider workflow with RENDER_API_KEY and RENDER_ROLLBACK_SERVICE_ID."
