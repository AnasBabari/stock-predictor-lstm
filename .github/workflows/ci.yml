name: StockLSTM CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.16
      - run: uv lock --project backend --check
      - run: uv sync --project backend --frozen --group training
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend ruff format --check backend
      - run: uv run --project backend mypy --config-file backend/pyproject.toml backend/api.py backend/model.py backend/data_pipeline.py backend/config.py backend/features backend/server_models
      - run: uv run --project backend bandit -r backend -x backend/tests,backend/.venv -ll -q
      - run: uv run --project backend pip-audit
      - run: uv run --project backend python scripts/check_api_docs.py
      - name: Run backend tests with coverage reports
        run: |
          mkdir -p reports
          uv run --project backend pytest backend/tests -q --cov=backend --cov-report=term-missing --cov-report=json:reports/coverage.json --cov-fail-under=70 --junitxml=reports/pytest.xml
      - name: Write backend test summary
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.etree import ElementTree

          report_dir = Path("reports")
          root = ElementTree.parse(report_dir / "pytest.xml").getroot()
          tests = int(root.attrib.get("tests", sum(int(node.attrib.get("tests", 0)) for node in root.iter("testsuite"))))
          coverage = json.loads((report_dir / "coverage.json").read_text(encoding="utf-8"))
          percent = coverage["totals"]["percent_covered"]
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("## Backend test evidence\\n\\n")
              handle.write(f"- Tests: {tests}\\n")
              handle.write(f"- Coverage: {percent:.2f}%\\n")
              handle.write(f"- Python: {sys.version.split()[0]}\\n")
              handle.write(f"- Commit: {os.environ.get('GITHUB_SHA', 'unknown')}\\n")
              handle.write(f"- Generated: {datetime.now(timezone.utc).isoformat()}\\n")
          PY

  frontend-unit-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  frontend-contract-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Browser contract tests (server path + stub worker, no real TF.js training)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/server-contract.spec.js e2e/fixtures.spec.js
        working-directory: frontend
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
- run: python scripts/check_text_hygiene.py
      - run: python scripts/check_ci_policy.py
      - run: python scripts/check_methodology_gate.py

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, policy, frontend-unit-build, frontend-contract-e2e]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify frontend API proxy reaches backend search JSON
        run: |
          curl --fail --silent --show-error \
            "http://localhost:5500/api/v1/search?query=AAPL" \
            | python -c 'import json,sys; body=json.load(sys.stdin); assert isinstance(body["results"], list)'
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

