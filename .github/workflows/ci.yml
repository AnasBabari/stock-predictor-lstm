name: Signal Seven CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, overhaul/volatility-forecasting]
  pull_request:
    branches: [main, develop, overhaul/volatility-forecasting]

permissions:
  contents: read

jobs:
  backend-and-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Install CPU PyTorch for research tests
        run: python -m pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install ONNX Runtime for G3 volatility tests
        run: python -m pip install "onnxruntime==1.19.2"
      - name: Verify research test runtime
        run: python -c "import torch; assert torch.version.cuda is None; print('CPU PyTorch', torch.__version__); import onnxruntime; print('ONNX Runtime', onnxruntime.__version__)"
      - name: Ruff Check
        run: ruff check .
      - name: Ruff Format Check
        run: ruff format --check .
      - name: Run Backend & Research Tests
        run: pytest -c backend/pyproject.toml backend/tests research/tests -q -ra

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run Frontend Tests
        run: npm test -- --run
        working-directory: frontend
      - name: Build Frontend Bundle
        run: npm run build
        working-directory: frontend
