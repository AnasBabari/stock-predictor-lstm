name: Volatility Forecasting CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, overhaul/volatility-forecasting]
  pull_request:
    branches: [main, develop, overhaul/volatility-forecasting]

permissions:
  contents: read

jobs:
  backend-and-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff Check
        run: ruff check .
      - name: Ruff Format Check
        run: ruff format --check .
      - name: Run Backend & Research Tests
        run: pytest -c backend/pyproject.toml backend/tests research/tests -q -ra

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run Frontend Tests
        run: npm test -- --run
        working-directory: frontend
      - name: Build Frontend Bundle
        run: npm run build
        working-directory: frontend
