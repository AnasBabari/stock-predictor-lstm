name: Publish signed model bundle

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: Bundle version
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build model bundle
        env:
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: python scripts/package_model_bundle.py --source backend/saved_models --output dist/model-bundle.zip --manifest dist/model-bundle.json
      - name: Sign model bundle manifest
        env:
          MODEL_BUNDLE_PRIVATE_KEY_B64: ${{ secrets.MODEL_BUNDLE_PRIVATE_KEY_B64 }}
        run: python scripts/package_model_bundle.py --sign dist/model-bundle.json --signature dist/model-bundle.sig
      - name: Publish GitHub release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: gh release create "$BUNDLE_VERSION" dist/model-bundle.zip dist/model-bundle.json dist/model-bundle.sig --title "Model bundle $BUNDLE_VERSION" --notes "Signed model artifacts; configure the deployment bundle URL and public key before activation."